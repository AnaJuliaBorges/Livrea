name: Vitest Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Vitest tests
        # env vars fake das APIs externas/Supabase vêm de vite.config.ts
        # (test.env) — não dependem de secrets do CI, então essas vars não
        # são mais necessárias aqui (o nome antigo, VITE_SUPABASE_ANON_KEY,
        # nem batia com o que src/lib/supabase.ts lê)
        run: npm run test:coverage

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: coverage/
          retention-days: 7
